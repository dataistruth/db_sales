bundle:
  name: db_sales

variables:
  catalog:
    description: "Unity Catalog name for this environment"
    default: db_sales

  developer:
      description: Developer short name for isolation
      default: ${workspace.current_user.short_name}

  env:
    description: Deployment environment
    default: dev

  bronze_schema:
    description: "Bronze layer schema name"
    default: bronze

  silver_schema:
    description: "Silver layer schema name"
    default: silver

  gold_schema:
    description: "Gold layer schema name"
    default: gold

  bronze_volume_path:
    description: "Full UC volume path for raw ingestion landing zone under bronze"
    default: /Volumes/db_sales/bronze/raw_landing

  libs_volume:
    description: "Full UC volume path for library and wheels"
    default: /Volumes/db_sales/bronze/libs

  alert_email:
    description: "Email for job failure alerts"
    default: msingh@computomic.com

workspace:
  root_path: /Workspace/Users/msingh@computomic.com/.bundle/${bundle.name}/${bundle.target}

include:
  - resources/jobs/*.yml           # ← /jobs/bronze_job.yml etc
  - resources/jobs/*/*.yml         # ← /jobs/silver/*.yml
                                   #   /jobs/gold/*.yml
                                   #   /jobs/bronze/*.yml
                                   #   /jobs/maintenance/*.yml
  - resources/pipelines/*.yml      # ← /pipelines/silver_pipeline.yml
  - resources/pipelines/*/*.yml    # ← /pipelines/silver/*.yml
  - resources/schema/*.yml         # ← /schema/create_schemas.yml

targets:

  dev:
    mode: development
    default: true
    variables:
      env:                dev                  # ← fixed from qa
      catalog:            dev_db_sales_${workspace.current_user.short_name}
      bronze_volume_path: /Volumes/dev_db_sales_${workspace.current_user.short_name}/bronze/raw_landing
      libs_volume:        /Volumes/dev_db_sales_${workspace.current_user.short_name}/bronze/libs

  qa:
    mode: development
    variables:
      env:                qa                   # ← fixed
      catalog:            qa_db_sales          # ← fixed, no user suffix
      bronze_volume_path: /Volumes/qa_db_sales/bronze/raw_landing
      libs_volume:        /Volumes/qa_db_sales/bronze/libs
      alert_email: msingh@computomic.com

  prod:
    mode: production
    workspace:
      host:      https://dbc-d33e9617-778d.cloud.databricks.com/
      root_path: /Workspace/Shared/db_sales/prod   # ← fixed YAML formatting
    variables:
      env:                prod
      catalog:            db_sales
      bronze_schema:      bronze
      silver_schema:      silver
      gold_schema:        gold
      bronze_volume_path: /Volumes/${var.catalog}/bronze/raw_landing
      libs_volume:        /Volumes/${var.catalog}/bronze/libs
      alert_email: msingh@computomic.com